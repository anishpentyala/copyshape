[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copyshape"
version = "0.1.0"
description = "Read-only hardlink expansion and dense-copy capacity models"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
copyshape = "copyshape.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
